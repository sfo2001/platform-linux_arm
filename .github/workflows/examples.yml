name: Examples

on:
  push:
    branches:
      - master
      - develop
      - 'claude/**'
  pull_request:

jobs:
  # Validation checks (JSON, Python)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON files
        run: |
          echo "Validating board definition JSON files..."
          for file in boards/*.json; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null || exit 1
          done
          echo "✅ All JSON files are valid"

      - name: Validate platform.json
        run: |
          echo "Validating platform.json..."
          python -m json.tool platform.json > /dev/null || exit 1
          echo "✅ platform.json is valid"

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          python -m py_compile platform.py
          python -m py_compile builder/main.py
          python -m py_compile builder/frameworks/*.py
          echo "✅ All Python files have valid syntax"

  # Build examples on multiple OS
  build:
    runs-on: ${{ matrix.os }}
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        example:
          - examples/baremetal-hello
          - examples/baremetal-threads
          - examples/lgpio-blink
          # Note: wiringpi/pigpio examples excluded - require system libraries
          # that don't support cross-compilation (libraries must be on build host)
        exclude:
          # Exclude lgpio on Windows (complex cross-compile setup)
          - os: windows-latest
            example: examples/lgpio-blink

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ubuntu: Install ARM cross-compilation toolchains
      - name: Install ARM toolchains (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # macOS: Install ARM cross-compilation toolchains
      - name: Install ARM toolchains (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew tap messense/macos-cross-toolchains
          brew install arm-unknown-linux-gnueabihf aarch64-unknown-linux-gnu

      # Windows: Install ARM cross-compilation toolchains
      - name: Install ARM toolchains (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Download ARM GNU Toolchain (arm-none-linux-gnueabihf variant works for Linux)
          echo "Downloading ARM GNU Toolchain for Windows..."
          curl -L -o gcc-arm.zip "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-mingw-w64-i686-arm-none-linux-gnueabihf.zip"

          echo "Extracting toolchain..."
          unzip -q gcc-arm.zip

          # Find the extracted directory (case-insensitive) and get absolute path
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -iname "arm-gnu-toolchain*" -print -quit | sed 's|^\./||')
          echo "Found toolchain directory: $TOOLCHAIN_DIR"

          # Create symlinks from arm-linux-gnueabihf-* to arm-none-linux-gnueabihf-*
          # The toolchain uses "arm-none-linux-gnueabihf" but PlatformIO expects "arm-linux-gnueabihf"
          echo "Creating symlinks for PlatformIO compatibility..."
          cd "$TOOLCHAIN_DIR/bin"
          for file in arm-none-linux-gnueabihf-*; do
            link_name=$(echo "$file" | sed 's/arm-none-linux-gnueabihf-/arm-linux-gnueabihf-/')
            if [ ! -e "$link_name" ]; then
              ln -s "$file" "$link_name"
              echo "  Created: $link_name -> $file"
            fi
          done
          cd "$GITHUB_WORKSPACE"

          # Get absolute path - convert to Windows path format
          TOOLCHAIN_BIN="$GITHUB_WORKSPACE/$TOOLCHAIN_DIR/bin"
          echo "Toolchain bin path: $TOOLCHAIN_BIN"

          # Convert to Windows path format for GITHUB_PATH
          TOOLCHAIN_BIN_WINDOWS=$(cygpath -w "$TOOLCHAIN_BIN")
          echo "Windows path format: $TOOLCHAIN_BIN_WINDOWS"

          # Add to PATH for subsequent steps (Windows format)
          echo "$TOOLCHAIN_BIN_WINDOWS" >> $GITHUB_PATH
          echo "Added to GITHUB_PATH: $TOOLCHAIN_BIN_WINDOWS"

          # Verify installation and symlinks
          echo "Verifying toolchain binaries and symlinks..."
          ls -la "$TOOLCHAIN_DIR/bin/" | grep -E "(arm-linux-gnueabihf-gcc|arm-none-linux-gnueabihf-gcc)" || true

          # Test if arm-linux-gnueabihf-gcc exists
          if [ -f "$TOOLCHAIN_DIR/bin/arm-linux-gnueabihf-gcc.exe" ] || [ -L "$TOOLCHAIN_DIR/bin/arm-linux-gnueabihf-gcc.exe" ]; then
            echo "✅ arm-linux-gnueabihf-gcc.exe found (symlink or file)"
          else
            echo "❌ arm-linux-gnueabihf-gcc.exe NOT found"
          fi

      # Debug: Verify PATH (Windows only)
      - name: Debug PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "=== Current PATH ==="
          echo "$PATH" | tr ':' '\n'
          echo ""
          echo "=== Checking for arm-linux-gnueabihf-gcc ==="
          which arm-linux-gnueabihf-gcc || echo "arm-linux-gnueabihf-gcc not found in PATH"
          echo ""
          echo "=== All executables in PATH matching 'arm' ==="
          find $(echo "$PATH" | tr ':' '\n') -maxdepth 1 -iname "*arm*" 2>/dev/null | head -20 || true

      # Build lgpio for ARM cross-compilation (32-bit) - Ubuntu/macOS only
      - name: Build lgpio for ARM cross-compilation (32-bit)
        if: matrix.os != 'windows-latest' && matrix.example == 'examples/lgpio-blink'
        shell: bash
        run: |
          echo "Building lgpio library for ARM 32-bit..."
          ./scripts/setup-lgpio-cross.sh

      # Build lgpio for ARM cross-compilation (64-bit) - Ubuntu/macOS only
      - name: Build lgpio for ARM cross-compilation (64-bit)
        if: matrix.os != 'windows-latest' && matrix.example == 'examples/lgpio-blink'
        shell: bash
        run: |
          echo "Building lgpio library for ARM 64-bit..."
          CROSS_PREFIX=aarch64-linux-gnu- \
          INSTALL_DIR=$HOME/.local/aarch64-linux-gnu \
          ./scripts/setup-lgpio-cross.sh

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Install platform (symlink mode)
        run: pio pkg install --global --platform symlink://.

      - name: Build example
        run: pio run -d ${{ matrix.example }}
