name: Examples

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/baremetal-hello
          - examples/lgpio-blink
          # Note: pigpio-blink not tested (deprecated framework, no CI setup)
          # Note: wiringpi examples not tested (require native Pi hardware)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ARM cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build lgpio for ARM cross-compilation (32-bit)
        run: |
          echo "Building lgpio library for ARM 32-bit..."
          ./scripts/setup-lgpio-cross.sh

      - name: Build lgpio for ARM cross-compilation (64-bit)
        run: |
          echo "Building lgpio library for ARM 64-bit..."
          CROSS_PREFIX=aarch64-linux-gnu- \
          INSTALL_DIR=$HOME/.local/aarch64-linux-gnu \
          ./scripts/setup-lgpio-cross.sh

      - name: Install PlatformIO Core
        run: pip install -U https://github.com/platformio/platformio-core/archive/develop.zip

      - name: Install platform (symlink mode)
        run: pio pkg install --global --platform symlink://.

      - name: Build example
        run: pio run -d ${{ matrix.example }}
