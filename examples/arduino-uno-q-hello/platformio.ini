; Arduino Uno Q — bare-metal AArch64 hello-world example
; Demonstrates compile + optional SSH upload for the Arduino Uno Q (QRB2210, AArch64)
; No GPIO framework — pure C application for Linux AArch64.
;
; Build:   pio run -d examples/arduino-uno-q-hello
; Upload:  pio run -d examples/arduino-uno-q-hello -t upload
;
; Requires: aarch64-linux-gnu cross-compiler (sudo apt install gcc-aarch64-linux-gnu)

[env:arduino_uno_q]
platform = linux_arm
board = arduino_uno_q
; No framework — bare-metal C application

; Uncomment to enable SSH upload:
; upload_protocol = scp
; upload_port = user@uno-q-host
; upload_path = /tmp/hello_uno_q
; upload_run_after = true
