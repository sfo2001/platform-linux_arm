; Arduino Uno Q — arduino-bridge framework example
;
; Demonstrates using Bridge.call() to invoke user-defined RPC methods on the
; STM32U585 MCU via the arduino-router Unix socket.
;
; Build:   pio run -d examples/arduino-bridge-blink
; Upload:  pio run -d examples/arduino-bridge-blink -t upload
;
; Requirements:
;   1. Cross-compile MRAA for AArch64:
;      CROSS_PREFIX=aarch64-linux-gnu- ./scripts/setup-mraa-cross.sh
;   2. Install msgpack-cxx headers: sudo apt install libmsgpack-cxx-dev
;   3. Flash MCU with companion sketch: mcu_companion/ArduinoUnoQ_MraaCompanion.ino
;
; Target runtime requirements:
;   1. arduino-router daemon running: systemctl status arduino-router
;   2. MCU flashed with mcu_companion/ArduinoUnoQ_MraaCompanion.ino

[env:arduino_uno_q]
platform = linux_arm
board = arduino_uno_q
framework = arduino-bridge

; Uncomment for SSH upload to the board:
; upload_protocol = scp
; upload_port = user@uno-q-host
; upload_path = ~/bridge_blink
; upload_run_after = true
